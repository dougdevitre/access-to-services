name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate resource directory
        run: node scripts/validate.js

      - name: Run tests
        run: node tests/eligibility.test.js

      - name: Check i18n coverage
        run: node scripts/check-i18n.js

      - name: Check FPL year
        run: node scripts/check-fpl-year.js

  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-label PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const labels = new Set();
            for (const f of files) {
              if (f.filename === 'mo-resources.json') labels.add('data');
              if (f.filename.endsWith('.jsx') || f.filename.endsWith('.js')) labels.add('code');
              if (f.filename === 'i18n.js') labels.add('i18n');
              if (f.filename.endsWith('.md')) labels.add('docs');
              if (f.filename.startsWith('.github/')) labels.add('ci');
              if (f.filename.startsWith('tests/') || f.filename.startsWith('scripts/')) labels.add('testing');
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [...labels],
              });
            }
